<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
<title>Luan</title>
<link rel="icon" type="image/png" href="Icono.png">
<link rel="apple-touch-icon" href="Icono.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1530">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luan">
<style>
  :root {
    --bg: #1a1530;
    --bg-2: #241d3e;
    --eye: #35b6f0;
    --eye-glow: rgba(53,182,240,0.35);
    --text: #cfe9fb;
    --text-dim: #7d8bb0;
    --bubble-user: #3a3260;
    --bubble-luan: #223a52;
    --panel: #150f28;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* ---------- Layout shell ---------- */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100vw;
    position: relative;
  }

  /* Eyes stage */
  #stage {
    flex: 1 1 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 35%, var(--bg-2) 0%, var(--bg) 70%);
    min-height: 0;
  }
  #eyes {
    display: flex;
    gap: 8vmin;
    align-items: center;
    justify-content: center;
  }
  .eye {
    width: 16vmin;
    height: 20vmin;
    max-width: 140px;
    max-height: 175px;
    background: var(--eye);
    border-radius: 50%;
    box-shadow: 0 0 1.2vmin var(--eye-glow);
    transform-origin: center;
    animation: blink 4.5s infinite ease-in-out;
    transition: transform 0.15s ease, height 0.15s ease, border-radius 0.15s ease;
  }
  .eye.right { animation-delay: 0.05s; }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
  }

  /* thinking state: eyes narrow + sway */
  #app[data-state="thinking"] .eye {
    animation: think 1s infinite ease-in-out;
  }
  @keyframes think {
    0%, 100% { transform: translateY(0) scaleY(0.85); }
    50% { transform: translateY(-1.2vmin) scaleY(0.85); }
  }
  /* talking state: eyes pulse gently */
  #app[data-state="talking"] .eye {
    animation: talk 0.35s infinite ease-in-out;
  }
  @keyframes talk {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.75); }
  }

  /* ---------- Lienzo / dibujo ---------- */
  #canvasBox {
    display: none;
    position: relative;
    width: min(62vmin, 380px);
    height: min(62vmin, 380px);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
  }
  #canvasBox.show { display: block; }
  #drawingSvg {
    width: 100%;
    height: 100%;
    display: block;
  }
  #drawingSvg path {
    fill: none;
    stroke: var(--eye);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #brush {
    position: absolute;
    top: 50%;
    left: 50%;
    font-size: 34px;
    transform: translate(-50%, -50%) rotate(-40deg);
    display: none;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
  }
  #canvasBox.painting #brush {
    display: block;
    animation: brushMove 1.6s infinite ease-in-out;
  }
  @keyframes brushMove {
    0%   { top: 22%; left: 20%; transform: translate(-50%, -50%) rotate(-35deg); }
    20%  { top: 25%; left: 75%; transform: translate(-50%, -50%) rotate(-15deg); }
    40%  { top: 55%; left: 30%; transform: translate(-50%, -50%) rotate(-55deg); }
    60%  { top: 70%; left: 78%; transform: translate(-50%, -50%) rotate(-20deg); }
    80%  { top: 40%; left: 55%; transform: translate(-50%, -50%) rotate(-45deg); }
    100% { top: 22%; left: 20%; transform: translate(-50%, -50%) rotate(-35deg); }
  }

  /* Subtitles (horizontal mode) */
  #subtitle {
    position: absolute;
    left: 6%;
    right: 6%;
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: clamp(13px, 2.2vmin, 20px);
    color: var(--eye);
    line-height: 1.35;
    max-height: 3.6em;
    overflow: hidden;
    background: rgba(10, 8, 20, 0.55);
    padding: 6px 12px;
    border-radius: 12px;
    pointer-events: none;
  }

  /* Top-left history button */
  #historyBtn {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 14px;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 20;
  }
  #historyBtn:active { background: rgba(255,255,255,0.14); }

  /* Chat-split toggle button (solo visible en horizontal) */
  #chatBtn {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 62px;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    z-index: 20;
  }
  #chatBtn.on { color: var(--eye); border-color: var(--eye); }
  #app[data-orient="landscape"] #chatBtn { display: flex; }

  /* Voice toggle button, top-right */
  #voiceBtn {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 14px;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    z-index: 20;
  }
  #voiceBtn.off { opacity: 0.4; }

  /* Subtitle toggle button, top-right (sits left of the voice button) */
  #ccBtn {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 62px;
    height: 40px;
    padding: 0 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
    z-index: 20;
  }
  #ccBtn.on { color: var(--eye); border-color: var(--eye); }

  /* ---------- Chat panel ---------- */
  #chatPanel {
    flex: 0 0 auto;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    border-top: 1px solid rgba(255,255,255,0.06);
    min-height: 0;
  }
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 14px 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .msg {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.luan {
    align-self: flex-start;
    background: var(--bubble-luan);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.luan.pending { color: var(--text-dim); font-style: italic; }

  #inputRow {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  #textInput {
    flex: 1 1 auto;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    outline: none;
  }
  #textInput::placeholder { color: var(--text-dim); }
  #sendBtn {
    background: var(--eye);
    color: #0b1622;
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.45; }

  /* ---------- History drawer ---------- */
  #historyDrawer {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: min(78vw, 300px);
    background: var(--panel);
    transform: translateX(-105%);
    transition: transform 0.25s ease;
    z-index: 30;
    padding: calc(env(safe-area-inset-top,0px) + 18px) 16px 16px;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  #historyDrawer.open { transform: translateX(0); }
  #historyDrawer { overflow-y: auto; }
  #historyDrawer h3 { margin: 0 0 12px; font-size: 15px; color: var(--text-dim); font-weight: 600; }
  #historyDrawer h3.drawings-title { margin-top: 22px; }
  .history-item {
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    font-size: 13.5px;
    color: var(--text);
  }
  #drawingsList {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #drawingsCount { color: var(--text-dim); font-weight: 400; }
  .drawing-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
  }
  .drawing-item .thumb {
    width: 46px;
    height: 46px;
    flex: 0 0 auto;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    overflow: hidden;
  }
  .drawing-item .thumb svg { width: 100%; height: 100%; }
  .drawing-item .thumb svg path {
    fill: none;
    stroke: var(--eye);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .drawing-item .caption {
    flex: 1 1 auto;
    font-size: 12px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .drawing-item button {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    font-size: 14px;
  }
  .drawings-empty {
    font-size: 12.5px;
    color: var(--text-dim);
    padding: 4px 2px;
  }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 25;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }

  /* ---------- Layout modes ---------- */

  /* PORTRAIT (default / vertical): split screen, eyes 55% / chat 45% */
  #app[data-orient="portrait"] #stage { flex: 0 0 50%; }
  #app[data-orient="portrait"] #chatPanel { flex: 1 1 50%; }
  #app[data-orient="portrait"] #subtitle { display: none; }
  #app[data-orient="portrait"] #ccBtn { display: none; }

  /* LANDSCAPE (horizontal): eyes fullscreen, chat becomes the history drawer content */
  #app[data-orient="landscape"] #stage { flex: 1 1 auto; }
  #app[data-orient="landscape"] #chatPanel { display: none; }
  #app[data-orient="landscape"] #subtitle.hidden { display: none; }
  #app[data-orient="landscape"] #landscapeInputRow { display: flex; }

  /* Pantalla dividida en horizontal: ojos a la izquierda, chat a la derecha */
  #app[data-orient="landscape"][data-split="on"] {
    flex-direction: row;
  }
  #app[data-orient="landscape"][data-split="on"] #stage {
    flex: 1 1 50%;
    min-width: 0;
  }
  #app[data-orient="landscape"][data-split="on"] #chatPanel {
    display: flex;
    flex: 1 1 50%;
    min-width: 0;
    border-top: none;
    border-left: 1px solid rgba(255,255,255,0.08);
  }
  #app[data-orient="landscape"][data-split="on"] #landscapeInputRow {
    display: none;
  }

  #landscapeInputRow {
    display: none;
    position: absolute;
    left: 6%; right: 6%;
    bottom: calc(3% + env(safe-area-inset-bottom, 0px));
    gap: 8px;
    z-index: 15;
  }
  #landscapeInputRow input {
    flex: 1 1 auto;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
  }
  #landscapeInputRow button {
    background: var(--eye);
    color: #0b1622;
    border: none;
    border-radius: 20px;
    padding: 0 16px;
    font-weight: 700;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .eye { animation: none !important; }
  }
</style>
</head>
<body>
<div id="app" data-orient="portrait" data-state="idle">

  <div id="overlay"></div>
  <div id="historyDrawer">
    <h3>Conversaciones</h3>
    <div class="history-item">Chat actual</div>

    <h3 class="drawings-title">Dibujos <span id="drawingsCount"></span></h3>
    <div id="drawingsList"></div>
  </div>

  <div id="stage">
    <button id="historyBtn" aria-label="Historial">☰</button>
    <button id="chatBtn" aria-label="Ver chat">💬</button>
    <button id="voiceBtn" class="on" aria-label="Voz">🔊</button>
    <button id="ccBtn" class="on" aria-label="Subtítulos">Subtítulos</button>
    <div id="eyes">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    <div id="canvasBox">
      <svg id="drawingSvg" viewBox="0 0 400 400"></svg>
      <div id="brush">🖌️</div>
    </div>
    <div id="subtitle"></div>
    <div id="landscapeInputRow">
      <input id="landscapeInput" type="text" placeholder="Pregúntale algo a Luan..." />
      <button id="landscapeSend">Enviar</button>
    </div>
  </div>

  <div id="chatPanel">
    <div id="messages"></div>
    <div id="inputRow">
      <input id="textInput" type="text" placeholder="Pregúntale algo a Luan..." />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

</div>

<script>
(function () {
  const WORKER_URL = "https://luan-backend.calebgrandez550.workers.dev";

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  const app = document.getElementById('app');
  const stage = document.getElementById('stage');
  const messagesEl = document.getElementById('messages');
  const subtitleEl = document.getElementById('subtitle');
  const ccBtn = document.getElementById('ccBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const historyBtn = document.getElementById('historyBtn');
  const chatBtn = document.getElementById('chatBtn');
  const historyDrawer = document.getElementById('historyDrawer');
  const overlay = document.getElementById('overlay');

  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const landscapeInput = document.getElementById('landscapeInput');
  const landscapeSend = document.getElementById('landscapeSend');

  let subtitlesOn = true;
  let voiceOn = true;
  let busy = false;
  const turns = [];

  // ---- Voice (Web Speech API text-to-speech) ----
  const synth = window.speechSynthesis || null;
  let spanishVoice = null;

  function pickVoice() {
    if (!synth) return;
    const voices = synth.getVoices();
    if (!voices.length) return;
    spanishVoice =
      voices.find((v) => /es-(MX|419|US|PE|CO|AR)/i.test(v.lang)) ||
      voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('es')) ||
      null;
  }
  if (synth) {
    pickVoice();
    synth.addEventListener('voiceschanged', pickVoice);
  }

  function speak(text) {
    if (!synth || !voiceOn || !text) return;
    synth.cancel(); // corta cualquier voz anterior antes de hablar
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = spanishVoice ? spanishVoice.lang : 'es-MX';
    if (spanishVoice) utter.voice = spanishVoice;
    utter.rate = 1.02;
    utter.pitch = 1.35; // más agudo, para sonar más joven
    utter.onstart = () => setState('talking');
    utter.onend = () => setState('idle');
    utter.onerror = () => setState('idle');
    synth.speak(utter);
  }

  voiceBtn.addEventListener('click', () => {
    voiceOn = !voiceOn;
    voiceBtn.classList.toggle('off', !voiceOn);
    voiceBtn.textContent = voiceOn ? '🔊' : '🔇';
    if (!voiceOn && synth) synth.cancel();
  });

  function orientationFor() {
    // Usa la relación de aspecto real de la pantalla (no la del viewport,
    // que el teclado virtual reduce), para no confundir "apareció el
    // teclado" con "rotaste el celular".
    if (window.screen && window.screen.width && window.screen.height) {
      return window.screen.width > window.screen.height ? 'landscape' : 'portrait';
    }
    return window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
  }
  let orientationTimer = null;
  function applyOrientation() {
    clearTimeout(orientationTimer);
    orientationTimer = setTimeout(() => {
      app.dataset.orient = orientationFor();
    }, 200); // pequeño retraso: ignora resize momentáneos del teclado
  }
  applyOrientation();
  window.addEventListener('resize', applyOrientation);
  if (window.screen && window.screen.orientation) {
    window.screen.orientation.addEventListener('change', applyOrientation);
  }

  function openDrawer() { historyDrawer.classList.add('open'); overlay.classList.add('open'); }
  function closeDrawer() { historyDrawer.classList.remove('open'); overlay.classList.remove('open'); }
  historyBtn.addEventListener('click', openDrawer);

  let splitOn = false;
  chatBtn.addEventListener('click', () => {
    splitOn = !splitOn;
    app.dataset.split = splitOn ? 'on' : 'off';
    chatBtn.classList.toggle('on', splitOn);
    if (splitOn) messagesEl.scrollTop = messagesEl.scrollHeight;
  });
  overlay.addEventListener('click', closeDrawer);

  ccBtn.addEventListener('click', () => {
    subtitlesOn = !subtitlesOn;
    ccBtn.classList.toggle('on', subtitlesOn);
    ccBtn.textContent = subtitlesOn ? 'Subtítulos' : 'Subtítulos: no';
    if (!subtitlesOn) subtitleEl.textContent = '';
  });

  function addBubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'luan');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setState(state) {
    app.dataset.state = state;
  }

  // ---------- Galería de dibujos (localStorage, máx. 4) ----------
  const canvasBox = document.getElementById('canvasBox');
  const drawingSvg = document.getElementById('drawingSvg');
  const eyesEl = document.getElementById('eyes');
  const brushEl = document.getElementById('brush');
  const drawingsList = document.getElementById('drawingsList');
  const drawingsCount = document.getElementById('drawingsCount');
  const MAX_DRAWINGS = 4;

  function loadDrawings() {
    try {
      return JSON.parse(localStorage.getItem('luan-drawings') || '[]');
    } catch (e) {
      return [];
    }
  }
  function saveDrawings(list) {
    try {
      localStorage.setItem('luan-drawings', JSON.stringify(list));
    } catch (e) {}
  }
  function pathsToSvgMarkup(viewBox, paths) {
    const inner = paths.map((d) => `<path d="${d}"/>`).join('');
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}">${inner}</svg>`;
  }
  function renderDrawingsList() {
    const list = loadDrawings();
    drawingsCount.textContent = list.length ? `(${list.length}/${MAX_DRAWINGS})` : '';
    drawingsList.innerHTML = '';
    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'drawings-empty';
      empty.textContent = 'Aún no hay dibujos guardados.';
      drawingsList.appendChild(empty);
      return;
    }
    list.slice().reverse().forEach((item) => {
      const row = document.createElement('div');
      row.className = 'drawing-item';

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.innerHTML = pathsToSvgMarkup(item.viewBox, item.paths);
      row.appendChild(thumb);

      const cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = item.caption || 'Dibujo de Luan';
      row.appendChild(cap);

      const dlBtn = document.createElement('button');
      dlBtn.textContent = '⬇️';
      dlBtn.setAttribute('aria-label', 'Descargar');
      dlBtn.addEventListener('click', () => {
        const markup = pathsToSvgMarkup(item.viewBox, item.paths);
        const blob = new Blob([markup], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `luan-dibujo-${item.id}.svg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
      row.appendChild(dlBtn);

      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑️';
      delBtn.setAttribute('aria-label', 'Eliminar');
      delBtn.addEventListener('click', () => {
        const updated = loadDrawings().filter((d) => d.id !== item.id);
        saveDrawings(updated);
        renderDrawingsList();
      });
      row.appendChild(delBtn);

      drawingsList.appendChild(row);
    });
  }
  renderDrawingsList();

  function addDrawingToGallery(viewBox, paths, caption) {
    const list = loadDrawings();
    list.push({ id: Date.now(), viewBox, paths, caption, ts: Date.now() });
    while (list.length > MAX_DRAWINGS) list.shift();
    saveDrawings(list);
    renderDrawingsList();
  }

  // ---------- Animación de pincel + trazo del dibujo final ----------
  function startPainting() {
    eyesEl.style.display = 'none';
    canvasBox.classList.add('show', 'painting');
    drawingSvg.innerHTML = '';
  }

  function stopPaintingLoop() {
    canvasBox.classList.remove('painting');
  }

  function revealDrawing(viewBox, paths) {
    drawingSvg.setAttribute('viewBox', viewBox || '0 0 400 400');
    drawingSvg.innerHTML = '';
    let delay = 0;
    paths.forEach((d) => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      drawingSvg.appendChild(p);
      let len = 300;
      try { len = p.getTotalLength(); } catch (e) {}
      p.style.strokeDasharray = String(len);
      p.style.strokeDashoffset = String(len);
      const duration = Math.min(1400, Math.max(350, len * 2.2));
      p.style.transition = `stroke-dashoffset ${duration}ms ease ${delay}ms`;
      requestAnimationFrame(() => { p.style.strokeDashoffset = '0'; });
      delay += duration * 0.55;
    });
    return delay + 500; // tiempo total aproximado de la animación
  }

  function finishPainting() {
    canvasBox.classList.remove('show', 'painting');
    eyesEl.style.display = '';
  }

  function setInputsEnabled(enabled, placeholder) {
    [textInput, landscapeInput].forEach((el) => {
      el.disabled = !enabled;
      el.placeholder = placeholder || 'Pregúntale algo a Luan...';
    });
  }

  const DRAW_TRIGGER = /\bdibuj|\bdib[uú]jame|\bpinta(me)?\b|\bhaz(me)?\s+un\s+dibujo/i;

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true;
    sendBtn.disabled = true;
    landscapeSend.disabled = true;

    const isDrawRequest = DRAW_TRIGGER.test(question);

    addBubble('user', question);
    turns.push({ role: 'user', content: question });

    let pending;
    if (isDrawRequest) {
      setInputsEnabled(false, 'Luan está dibujando...');
      startPainting();
      pending = addBubble('luan', 'Estoy dibujando...');
      pending.classList.add('pending');
      if (subtitlesOn) subtitleEl.textContent = 'Estoy dibujando...';
      setState('thinking');
    } else {
      pending = addBubble('luan', 'Pensando...');
      pending.classList.add('pending');
      if (subtitlesOn) subtitleEl.textContent = '...';
      setState('thinking');
    }

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000); // 30s máximo (dibujar tarda más)
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: turns }),
        signal: controller.signal,
      });
      clearTimeout(timeout);
      const data = await res.json();

      if (data.type === 'draw' && Array.isArray(data.paths) && data.paths.length) {
        stopPaintingLoop();
        const revealMs = revealDrawing(data.viewBox, data.paths);
        const caption = data.caption || '¡Tu dibujo está terminado!';
        pending.textContent = caption;
        pending.classList.remove('pending');
        if (subtitlesOn) subtitleEl.textContent = caption;
        turns.push({ role: 'assistant', content: caption });
        addDrawingToGallery(data.viewBox || '0 0 400 400', data.paths, caption);
        speak(caption);
        setTimeout(finishPainting, revealMs + 2500);
      } else {
        if (isDrawRequest) finishPainting();
        const text = data.text || 'No pude pensar bien esta vez, ¿lo intentamos de nuevo?';
        pending.textContent = text;
        pending.classList.remove('pending');
        if (subtitlesOn) subtitleEl.textContent = text;
        turns.push({ role: 'assistant', content: text });
        speak(text); // setState('talking') / ('idle') lo maneja la voz al empezar/terminar
      }
    } catch (e) {
      if (isDrawRequest) finishPainting();
      const msg = e && e.name === 'AbortError'
        ? 'Tardé demasiado, ¿lo intentas de nuevo?'
        : 'No pude conectarme. ¿Lo intentamos de nuevo?';
      pending.textContent = msg;
      pending.classList.remove('pending');
      if (subtitlesOn) subtitleEl.textContent = msg;
      setState('idle');
    } finally {
      busy = false;
      sendBtn.disabled = false;
      landscapeSend.disabled = false;
      setInputsEnabled(true);
    }
  }

  function wireInput(inputEl, buttonEl) {
    buttonEl.addEventListener('click', () => {
      const v = inputEl.value;
      inputEl.value = '';
      ask(v);
    });
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const v = inputEl.value;
        inputEl.value = '';
        ask(v);
      }
    });
  }
  wireInput(textInput, sendBtn);
  wireInput(landscapeInput, landscapeSend);

  setTimeout(() => {
    const greet = '¡Hola! Soy Luan. Pregúntame lo que quieras.';
    addBubble('luan', greet);
    if (subtitlesOn) subtitleEl.textContent = greet;
  }, 300);
})();
</script>
</body>
</html>
